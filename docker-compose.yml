services:
  backend:
    build: ./backend
    container_name: tomato-backend
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - tomato-network

  frontend:
    build: ./frontend
    container_name: tomato-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - tomato-network

  admin:
    build: ./admin
    container_name: tomato-admin
    ports:
      - "5174:5174"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - tomato-network

networks:
  tomato-network:
    driver: bridge
